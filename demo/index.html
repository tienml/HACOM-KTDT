<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hacom AI Invest — Gợi ý quy trình đầu tư</title>
<link rel="icon" href="assets/shield.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <!-- Sidebar trái cố định theo mockup -->
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <img src="assets/shield.svg" alt="Hacom" class="side-brand-logo">
      <div class="side-brand-text">
        <span class="side-brand-title">Hacom AI Invest</span>
        <span class="side-brand-sub">AI gợi ý quy trình đầu tư</span>
      </div>
    </div>

    <nav class="side-nav" id="side-nav"></nav>

    <div class="side-foot">
      <div class="ai-card">
        <div class="ai-card-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 0 1 9 9c0 3.9-2.5 7.2-6 8.4"/><path d="M12 3a9 9 0 0 0-9 9c0 3.9 2.5 7.2 6 8.4"/><path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M9.5 15a3.5 3.5 0 0 0 5 0"/></svg>
          Trợ lý AI
        </div>
        <p class="ai-card-body">Đặt câu hỏi về quy trình đầu tư, AI sẽ phân tích và gợi ý quy trình phù hợp nhất.</p>
        <button class="btn btn-primary" data-action="go-ask">Chat với AI</button>
      </div>
      <div class="side-watermark"><img src="assets/watermark.svg" alt=""></div>
      <div class="side-copy">&copy; 2024 Hacom AI Invest<br>Tất cả quyền được bảo lưu.</div>
    </div>
  </aside>

  <!-- Nội dung chính -->
  <main class="main" id="main"></main>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
